name: Deploy para Hugging Face Spaces (CD)

on:
  workflow_run:
    workflows: ["Testes e Qualidade (CI)"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronização com Hugging Face Spaces
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push para Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ ERRO: O secret HF_TOKEN não está configurado no GitHub Actions!"
            echo "Vá em Settings > Secrets and variables > Actions e adicione o secret HF_TOKEN."
            exit 1
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Deploy"
          git remote add space "https://ramonbarrbosa:${HF_TOKEN}@huggingface.co/spaces/ramonbarrbosa/agente-teste"
          git push --force space main:main
          echo "🚀 Deploy finalizado com sucesso no Hugging Face Spaces!"
