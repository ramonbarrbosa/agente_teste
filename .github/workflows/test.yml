name: Testes e Qualidade (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-gate:
    name: Portão de Testes e Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Portão T1 - Validação do config.yaml
        run: |
          python src/validator.py config.yaml

      - name: Análise de Código (Linting com Ruff)
        run: |
          ruff check .

      - name: Portão T2 a T6 - Bateria de Testes Automatizados
        run: |
          pytest -v tests/
